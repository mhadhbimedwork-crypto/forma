name: Costruisci APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'capacitor.config.json', 'package.json', 'package-lock.json', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.android.appendUserAgent='FORGIAAPK/${{ github.run_number }}';fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
          node scripts/build-www.js www && npx cap sync android
      - name: Chiave di firma fissa (consegnata dal server solo a questa build)
        run: |
          set -e
          mkdir -p "$HOME/.android"
          T=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=forgia-apk-key" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).value))")
          curl -fsS -X POST -H "Authorization: Bearer $T" https://kjrspnfjmkyczuonqhur.supabase.co/functions/v1/apk-key | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).keystore))" | base64 -d > "$HOME/forgia-release.keystore"
          test -s "$HOME/forgia-release.keystore"
          echo "APK_KEYSTORE=$HOME/forgia-release.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore "$HOME/forgia-release.keystore" -storepass android | grep -i "fingerprint\|androiddebugkey"
      - name: Licenze Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compila APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Pubblica APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FORGIA-GYM.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "FORGIA GYM (APK Android)" --notes "Scarica FORGIA-GYM.apk e installalo sul telefono." --latest
          gh release upload apk FORGIA-GYM.apk --clobber
          gh release edit apk --notes "build ${{ github.run_number }}"
          gh release delete-asset apk FORMA.apk -y || true
