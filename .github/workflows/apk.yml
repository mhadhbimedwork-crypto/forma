name: Costruisci APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'capacitor.config.json', 'package.json', 'package-lock.json', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/build-www.js www && npx cap sync android
      - name: Chiave di firma (conservata nella cache di GitHub, mai nel codice)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: forma-firma-v1
      - name: Licenze Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compila APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Pubblica APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FORGIA.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "FORGIA (APK Android)" --notes "Scarica FORGIA.apk e installalo sul telefono." --latest
          gh release upload apk FORGIA.apk --clobber
          gh release delete-asset apk FORMA.apk -y || true
