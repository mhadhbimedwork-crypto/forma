name: Costruisci APK THE LIFTING ZONE
on:
  push:
    branches: [main]
    paths: ['android/**', 'android-tlz/**', 'icons/gym/**', 'package.json', 'package-lock.json', '.github/workflows/tlz-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Variante THE LIFTING ZONE (nome, indirizzo, icone, schermata iniziale)
        run: |
          node -e "
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          c.appId='it.tlz.app'; c.appName='THE LIFTING ZONE';
          c.server.url='https://mhadhbimedwork-crypto.github.io/forma/gym/'; c.android.appendUserAgent='TLZAPK/${{ github.run_number }}';
          fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
          node scripts/build-www.js www && npx cap sync android
          cp -r android-tlz/res/. android/app/src/main/res/
          sed -i 's#>FORGIA<#>THE LIFTING ZONE<#g; s#>it.forma.app<#>it.tlz.app<#g' android/app/src/main/res/values/strings.xml
          sed -i 's#0F766E#050507#' android/app/src/main/res/values/ic_launcher_background.xml
          cat android/app/src/main/res/values/strings.xml
      - name: Chiave di firma (conservata nella cache di GitHub, mai nel codice)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tlz-firma-v1
      - name: Licenze Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compila APK
        working-directory: android
        env:
          APP_ID: it.tlz.app
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Pubblica APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk THE_LIFTING_ZONE.apk
          gh release view tlz-apk >/dev/null 2>&1 || gh release create tlz-apk --title "THE LIFTING ZONE (APK Android)" --notes "Scarica THE_LIFTING_ZONE.apk e installalo sul telefono." --latest=false
          gh release upload tlz-apk THE_LIFTING_ZONE.apk --clobber
          gh release edit tlz-apk --notes "build ${{ github.run_number }}"
